<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>作業用紙｜夜の旧校舎 ― 保健室へ</title>
<style>
  @page { size: A4; margin: 12mm; }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { margin: 0; font-family: "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif; font-size: 10pt; color: #1c2124; background: #e9ecee; }
  .page { width: 210mm; min-height: 297mm; margin: 10mm auto; padding: 12mm; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  @media print { body { background: #fff; } .page { margin: 0; box-shadow: none; width: auto; min-height: auto; padding: 0; } }
  .top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid #1f3b3a; padding-bottom: 2mm; margin-bottom: 3mm; }
  h1 { font-size: 15pt; margin: 0; }
  .name { display: flex; gap: 4mm; font-size: 9pt; color: #5b666c; width: 95mm; }
  .name span { flex: 1; border-bottom: 1px solid #b9c2c7; padding-bottom: .5mm; }
  .hint { font-size: 9pt; color: #5b666c; margin: 0 0 2mm; }
  .grid {
    height: 196mm; border: 1px solid #9aa4aa;
    background-image:
      linear-gradient(#e3e8eb 1px, transparent 1px), linear-gradient(90deg, #e3e8eb 1px, transparent 1px),
      linear-gradient(#b9c2c7 1px, transparent 1px), linear-gradient(90deg, #b9c2c7 1px, transparent 1px);
    background-size: 5mm 5mm, 5mm 5mm, 25mm 25mm, 25mm 25mm;
  }
  h2 { font-size: 11pt; margin: 4mm 0 1.5mm; padding-left: 2.5mm; border-left: 4px solid #9b2226; }
  .memo { border: 1px dashed #b9c2c7; border-radius: 4px; height: 38mm; padding: 2mm 3mm; color: #a0a9ae; font-size: 9pt; }
</style>
</head>
<body>
<section class="page">
  <div class="top">
    <h1>作業用紙：平面図を描こう</h1>
    <div class="name"><span>学籍番号：</span><span>氏名：</span></div>
  </div>
  <p class="hint">細い線＝1m、太い線＝5m。部屋の大きさ・扉の位置・①〜⑥の場所・照明の位置を描き込む。</p>
  <div class="grid"></div>
  <h2>メモ（気づいたこと・工夫したいこと）</h2>
  <div class="memo">例：曲がり角の手前の照明を消して、角の先をもっと暗くしたい</div>
</section>
</body>
</html>
